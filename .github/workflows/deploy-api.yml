name: Deploy API

# 이미지 빌드는 항상 돈다 — Dockerfile이 조용히 썩는 것을 막는다.
# 레지스트리 푸시는 저장소 변수 DEPLOY_API_ENABLED=true 일 때만 한다.
#
# 켜는 법: Settings → Secrets and variables → Actions → Variables 에
#          DEPLOY_API_ENABLED = true 를 추가한다.
#          GHCR 인증은 GITHUB_TOKEN으로 되므로 별도 시크릿이 필요 없다.
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'prisma/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-api.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy-api.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/api

jobs:
  image:
    name: Build image (publish when enabled)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      # GHCR 푸시에 필요하다. 푸시하지 않는 실행에서도 무해하다.
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve publish decision
        id: decision
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ vars.DEPLOY_API_ENABLED }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::이미지를 빌드만 하고 푸시하지 않습니다. 푸시하려면 저장소 변수 DEPLOY_API_ENABLED=true 를 설정하세요."
          fi

      - name: Log in to GHCR
        if: steps.decision.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # pnpm 워크스페이스라 빌드 컨텍스트는 반드시 저장소 루트여야 한다.
          context: .
          file: apps/api/Dockerfile
          push: ${{ steps.decision.outputs.publish == 'true' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 레이어 7 §7.5: "프로덕션 마이그레이션은 수동 승인 + prisma migrate deploy".
      # 이미지 배포와 스키마 변경을 한 단계로 묶지 않는다.
      - name: Remind about migrations
        if: steps.decision.outputs.publish == 'true'
        run: |
          echo "::notice::이미지가 푸시됐습니다. 스키마 변경이 포함된 릴리스라면 배포 전에 \`pnpm db:migrate:prod\`를 수동으로 실행하세요."
