name: Backup Database

# 일일 pg_dump. 저장소 변수 BACKUP_ENABLED=true 일 때만 돈다.
#
# ⚠️ 트레이드오프를 알고 켜야 한다.
#    이 워크플로를 켜면 (1) 운영 DB가 GitHub 러너의 IP에서 접근 가능해야 하고
#    (2) 운영 DB 자격증명이 GitHub Secrets에 놓인다. 아동 이름·치료 메모가 담긴
#    DB라 둘 다 가벼운 결정이 아니다. DB 호스트에서 cron으로 같은 스크립트를
#    (scripts/backup-db.sh) 돌리는 편이 노출면이 훨씬 좁다.
#    GitHub 아티팩트는 보존 상한이 90일이라 장기 보관용도 아니다 — 임시 방편이다.
#
# 켜는 법:
#   Variables: BACKUP_ENABLED = true
#   Secrets:   BACKUP_DATABASE_URL — 읽기 전용 롤 권장
#              BACKUP_PASSPHRASE   — 덤프 대칭키 암호화용. 없으면 실패시킨다.
on:
  schedule:
    # 매일 18:00 UTC = 03:00 KST (트래픽이 가장 적은 시간대)
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    name: pg_dump and archive
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: vars.BACKUP_ENABLED == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 시크릿을 ${{ }}로 셸에 직접 펼치지 않는다 — env로 넘겨 셸 변수로만 읽는다.
      - name: Fail fast on missing secrets
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "${BACKUP_DATABASE_URL:-}" ]; then
            echo "::error::BACKUP_DATABASE_URL 시크릿이 없습니다."
            exit 1
          fi
          # 평문 덤프를 아티팩트로 올리는 일은 막는다.
          if [ -z "${BACKUP_PASSPHRASE:-}" ]; then
            echo "::error::BACKUP_PASSPHRASE 시크릿이 없습니다. 개인정보가 든 덤프를 평문으로 보관할 수 없습니다."
            exit 1
          fi

      # 러너의 pg_dump는 구버전일 수 있다. 서버(16)보다 낮으면 거부당한다.
      - name: Install PostgreSQL 16 client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-16

      - name: Run backup
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          chmod +x scripts/backup-db.sh
          ./scripts/backup-db.sh ./backups

      - name: Upload encrypted dump
        uses: actions/upload-artifact@v4
        with:
          name: eobom-db-backup-${{ github.run_id }}
          path: backups/*.dump.gpg
          # 아티팩트 보존 상한은 90일이다. 장기 보관은 오브젝트 스토리지로 옮겨야 한다.
          retention-days: 30
          if-no-files-found: error
